name: Build and Publish Study Tracker APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: "APK build variant ('debug' for auto-cached/fixed-key updates, or 'release' if RELEASE_KEYSTORE_BASE64 secrets are set)"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine build variant
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [[ -z "${BUILD_TYPE}" ]]; then
            BUILD_TYPE="debug"
          fi
          echo "build_type=${BUILD_TYPE}" >> "${GITHUB_OUTPUT}"
          echo "Selected build variant: ${BUILD_TYPE}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java environment
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v java >/dev/null 2>&1; then
            echo "::error::Java executable not found in PATH."
            exit 1
          fi

          java -version
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"

          RAW_VERSION="$(java -version 2>&1 | awk -F '"' '/version/ {print $2; exit}')"
          if [[ -z "${RAW_VERSION}" ]]; then
            echo "::error::Unable to detect the active Java version from 'java -version'."
            exit 1
          fi

          if [[ "${RAW_VERSION}" == 1.* ]]; then
            MAJOR_VERSION="$(echo "${RAW_VERSION}" | cut -d. -f2 | sed 's/[^0-9].*$//')"
          else
            MAJOR_VERSION="$(echo "${RAW_VERSION}" | cut -d. -f1 | sed 's/[^0-9].*$//')"
          fi

          if ! [[ "${MAJOR_VERSION}" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse numeric Java major version from '${RAW_VERSION}'."
            exit 1
          fi

          echo "Detected Java major version: ${MAJOR_VERSION}"
          if (( MAJOR_VERSION < 17 )); then
            echo "::error::Java 17 or newer is required, but detected Java ${MAJOR_VERSION} (${RAW_VERSION})."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore cached fixed debug keystore (if available)
        id: keystore_cache
        uses: actions/cache@v4
        with:
          path: ./debug.keystore
          key: study-tracker-fixed-debug-keystore-v1

      - name: Configure consistent signing keystore
        id: signing
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.variant.outputs.build_type }}
          CACHE_HIT: ${{ steps.keystore_cache.outputs.cache-hit }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
          if [[ ! -x "${KEYTOOL_BIN}" ]]; then
            echo "::error::keytool not found in configured Java 17 installation (${KEYTOOL_BIN})."
            exit 1
          fi

          DEBUG_KEYSTORE_PATH="./debug.keystore"
          DEBUG_KEYSTORE_B64_PATH="./debug.keystore.base64"

          if [[ -n "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]]; then
            echo "Restoring permanent debug keystore from ANDROID_DEBUG_KEYSTORE_BASE64 secret..."
            printf '%s' "${ANDROID_DEBUG_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > "${DEBUG_KEYSTORE_PATH}"
            DEBUG_SOURCE="ANDROID_DEBUG_KEYSTORE_BASE64 secret (permanent)"
          elif [[ -f "${DEBUG_KEYSTORE_B64_PATH}" && -s "${DEBUG_KEYSTORE_B64_PATH}" ]]; then
            echo "Restoring fixed debug keystore from ${DEBUG_KEYSTORE_B64_PATH}..."
            tr -d '\r\n ' < "${DEBUG_KEYSTORE_B64_PATH}" | base64 --decode > "${DEBUG_KEYSTORE_PATH}"
            DEBUG_SOURCE="committed debug.keystore.base64"
          elif [[ -f "${DEBUG_KEYSTORE_PATH}" && -s "${DEBUG_KEYSTORE_PATH}" ]]; then
            echo "Reusing persisted debug keystore from GitHub Actions cache (cache-hit=${CACHE_HIT})."
            DEBUG_SOURCE="cached fixed debug.keystore"
          else
            echo "Initializing persistent debug keystore (will be saved in GitHub Actions cache for future seamless updates)..."
            "${KEYTOOL_BIN}" -genkeypair \
              -keystore "${DEBUG_KEYSTORE_PATH}" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              >/dev/null 2>&1
            DEBUG_SOURCE="newly cached debug.keystore (set ANDROID_DEBUG_KEYSTORE_BASE64 secret for lifetime persistence)"
          fi

          DEBUG_SHA1="$("${KEYTOOL_BIN}" -list -v -keystore "${DEBUG_KEYSTORE_PATH}" -storepass android -alias androiddebugkey | awk '/SHA1:/ {print $2; exit}')"
          if [[ -z "${DEBUG_SHA1}" ]]; then
            echo "::error::Failed to verify androiddebugkey inside ${DEBUG_KEYSTORE_PATH}."
            exit 1
          fi
          DEBUG_SHA1_NORM="$(printf '%s' "${DEBUG_SHA1}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Verified debug keystore (${DEBUG_SOURCE}) SHA-1: ${DEBUG_SHA1}"

          if [[ "${BUILD_TYPE}" == "release" ]]; then
            RELEASE_KEYSTORE_PATH="./my-upload-key.jks"
            if [[ -z "${RELEASE_KEYSTORE_BASE64:-}" || -z "${STORE_PASSWORD:-}" || -z "${KEY_PASSWORD:-}" ]]; then
              echo "::error::Release build requires repository secrets: RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD (keyAlias must be 'upload'). Add these secrets or run with build_type=debug."
              exit 1
            fi
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | tr -d '\r\n ' | base64 --decode > "${RELEASE_KEYSTORE_PATH}"
            RELEASE_SHA1="$("${KEYTOOL_BIN}" -list -v -keystore "${RELEASE_KEYSTORE_PATH}" -storepass "${STORE_PASSWORD}" -alias upload | awk '/SHA1:/ {print $2; exit}')"
            if [[ -z "${RELEASE_SHA1}" ]]; then
              echo "::error::Failed to verify alias 'upload' in RELEASE_KEYSTORE_BASE64 with STORE_PASSWORD."
              exit 1
            fi
            RELEASE_SHA1_NORM="$(printf '%s' "${RELEASE_SHA1}" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            echo "Verified release keystore (alias=upload) SHA-1: ${RELEASE_SHA1}"
            echo "expected_sha1=${RELEASE_SHA1}" >> "${GITHUB_OUTPUT}"
            echo "expected_sha1_norm=${RELEASE_SHA1_NORM}" >> "${GITHUB_OUTPUT}"
            echo "signing_source=Fixed Release Upload Keystore (RELEASE_KEYSTORE_BASE64)" >> "${GITHUB_OUTPUT}"
          else
            echo "expected_sha1=${DEBUG_SHA1}" >> "${GITHUB_OUTPUT}"
            echo "expected_sha1_norm=${DEBUG_SHA1_NORM}" >> "${GITHUB_OUTPUT}"
            echo "signing_source=${DEBUG_SOURCE}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Configure Firebase google-services.json (Gemini AI Logic)
        id: configure_firebase
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail

          SOURCE="none"
          if [[ -n "${GOOGLE_SERVICES_JSON:-}" ]]; then
            printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
            SOURCE="GOOGLE_SERVICES_JSON secret"
          elif [[ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]]; then
            printf '%s' "${GOOGLE_SERVICES_JSON_BASE64}" | base64 --decode > app/google-services.json
            SOURCE="GOOGLE_SERVICES_JSON_BASE64 secret"
          elif [[ -f "app/google-services.json" && -s "app/google-services.json" ]]; then
            SOURCE="repository app/google-services.json"
          else
            echo "::error::app/google-services.json is missing! Add Repository Secret 'GOOGLE_SERVICES_JSON' with the full contents of app/google-services.json."
            exit 1
          fi

          echo "Loaded app/google-services.json from: ${SOURCE}"

          python3 - <<'PY'
          import json, sys

          with open("app/google-services.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          project_id = (data.get("project_info") or {}).get("project_id", "")
          if not project_id or "remixed" in project_id.lower() or "placeholder" in project_id.lower():
              print(f"::error::Invalid or placeholder project_id in app/google-services.json: '{project_id}'.")
              sys.exit(1)

          target_pkg = "com.aistudio.studytracker.qzmplk"
          clients = data.get("client") or []
          matched = next(
              (c for c in clients if ((c.get("client_info") or {}).get("android_client_info") or {}).get("package_name") == target_pkg),
              None
          )
          if not matched:
              print(f"::error::app/google-services.json is missing client entry for package '{target_pkg}'.")
              sys.exit(1)

          print(f"Validated Firebase AI Logic config for package '{target_pkg}' (project_id='{project_id}').")
          PY

          echo "configured=true" >> "${GITHUB_OUTPUT}"

      - name: Build APK
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.variant.outputs.build_type }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            gradle :app:assembleRelease --stacktrace --no-daemon
          else
            gradle :app:assembleDebug --stacktrace --no-daemon
          fi

      - name: Verify APK output, Firebase resources, and v2/v3 signing certificate
        id: verify_apk
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.variant.outputs.build_type }}
          EXPECTED_SHA1: ${{ steps.signing.outputs.expected_sha1 }}
          EXPECTED_SHA1_NORM: ${{ steps.signing.outputs.expected_sha1_norm }}
        run: |
          set -euo pipefail

          if [[ "${BUILD_TYPE}" == "release" ]]; then
            EXPECTED_APK="app/build/outputs/apk/release/app-release.apk"
          else
            EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [[ ! -f "${EXPECTED_APK}" || ! -s "${EXPECTED_APK}" ]]; then
            echo "::error::Expected APK not found or empty at ${EXPECTED_APK}."
            if [[ -d "app/build/outputs/apk" ]]; then
              find app/build/outputs/apk -type f -name "*.apk" -print || true
            fi
            exit 1
          fi

          APK_SIZE="$(wc -c < "${EXPECTED_APK}" | tr -d ' ')"
          echo "Verified APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APKSIGNER_BIN=""
          if [[ -n "${SDK_DIR}" && -d "${SDK_DIR}/build-tools" ]]; then
            APKSIGNER_BIN="$(find "${SDK_DIR}/build-tools" -type f -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          APK_SHA1_DISPLAY="${EXPECTED_SHA1}"
          if [[ -n "${APKSIGNER_BIN}" && -x "${APKSIGNER_BIN}" ]]; then
            CERT_INFO="$("${APKSIGNER_BIN}" verify --print-certs "${EXPECTED_APK}")"
            echo "${CERT_INFO}"
            APK_SHA1_NORM="$(printf '%s\n' "${CERT_INFO}" | awk '/SHA-1 digest:/ {print tolower($NF); exit}')"
            if [[ -z "${APK_SHA1_NORM}" ]]; then
              echo "::error::apksigner could not extract SHA-1 digest from ${EXPECTED_APK}."
              exit 1
            fi
            if [[ "${APK_SHA1_NORM}" != "${EXPECTED_SHA1_NORM}" ]]; then
              echo "::error::APK signing certificate mismatch! Expected ${EXPECTED_SHA1_NORM}, found ${APK_SHA1_NORM}."
              exit 1
            fi
            echo "Verified APK v2/v3 signing certificate matches keystore SHA-1."
          else
            echo "::warning::apksigner not found under SDK build-tools; skipping external v2/v3 cert check."
          fi

          python3 - "${EXPECTED_APK}" <<'PY'
          import sys, zipfile
          apk_path = sys.argv[1]
          with zipfile.ZipFile(apk_path) as z:
              data = z.read("resources.arsc")
          missing = [k for k in ("google_app_id", "google_api_key", "recaptcha_site_key") if k.encode() not in data]
          if missing:
              print(f"::error::Built APK is missing required Firebase resources: {missing}.")
              sys.exit(1)
          print("Verified Firebase AI & App Check resources (google_app_id, google_api_key, recaptcha_site_key) are bundled.")
          PY

          {
            echo "apk_path=${EXPECTED_APK}"
            echo "apk_sha1=${APK_SHA1_DISPLAY}"
            echo "apk_size=${APK_SIZE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload APK artifact
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: study-tracker-${{ steps.variant.outputs.build_type }}-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.variant.outputs.build_type }}
          SOURCE_APK: ${{ steps.verify_apk.outputs.apk_path }}
        run: |
          set -euo pipefail

          if [[ ! -f "${SOURCE_APK}" || ! -s "${SOURCE_APK}" || "${SOURCE_APK}" != *.apk ]]; then
            echo "::error::Verified APK is missing or invalid: ${SOURCE_APK}"
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME="$(printf '%s' "${RAW_REPO_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g; s/-+/-/g; s/^[.-]+//; s/[.-]+$//')"
          if [[ -z "${SAFE_REPO_NAME}" ]]; then
            SAFE_REPO_NAME="study-tracker"
          fi

          ASSET_FILENAME="${SAFE_REPO_NAME}-${BUILD_TYPE}-build-${GITHUB_RUN_NUMBER}.apk"
          RELEASE_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "${RELEASE_DIR}"

          ASSET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"
          cp "${SOURCE_APK}" "${ASSET_PATH}"

          RELEASE_TAG="${BUILD_TYPE}-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Study Tracker v1.0.${GITHUB_RUN_NUMBER}"

          {
            echo "asset_path=${ASSET_PATH}"
            echo "asset_name=${ASSET_FILENAME}"
            echo "release_tag=${RELEASE_TAG}"
            echo "release_title=${RELEASE_TITLE}"
          } >> "${GITHUB_OUTPUT}"

          echo "Prepared release asset: ${ASSET_FILENAME}"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ steps.variant.outputs.build_type }}
          ASSET_PATH: ${{ steps.prepare_release_asset.outputs.asset_path }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
          APK_SHA1: ${{ steps.verify_apk.outputs.apk_sha1 }}
          SIGNING_SOURCE: ${{ steps.signing.outputs.signing_source }}
        run: |
          set -euo pipefail

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not available on this runner."
            exit 1
          fi

          RELEASE_NOTES="$(cat <<EOF
          Automatically built **Study Tracker** APK (version **1.0.${GITHUB_RUN_NUMBER}**, build **#${GITHUB_RUN_NUMBER}**, variant: **${BUILD_TYPE}**).

          - **AI Coach:** Firebase AI Logic (Gemini Flash + Gemini Deep) with zero client API keys
          - **Signing Key:** ${SIGNING_SOURCE}
          - **Verified Certificate SHA-1:** \`${APK_SHA1}\`
          - **APK Asset:** \`${ASSET_NAME}\`

          ### Seamless In-Place Updates
          - Future builds signed with the same certificate SHA-1 update directly over the installed app without uninstalling or losing study data.
          - **Tip for lifetime signing persistence:** Save your base64 keystore as the \`ANDROID_DEBUG_KEYSTORE_BASE64\` GitHub secret so the key never expires even after long breaks between builds.
          EOF
          )"

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${ASSET_PATH}" --clobber
            gh release edit "${RELEASE_TAG}" --title "${RELEASE_TITLE}" --notes "${RELEASE_NOTES}" --latest
          else
            gh release create "${RELEASE_TAG}" "${ASSET_PATH}" \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_NOTES}" \
              --target "${GITHUB_SHA}" \
              --latest
          fi

      - name: Report APK build & signing summary
        if: ${{ always() && steps.upload_apk.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TYPE: ${{ steps.variant.outputs.build_type }}
          PUBLISH_OUTCOME: ${{ steps.publish_release.outcome }}
          FIREBASE_CONFIGURED: ${{ steps.configure_firebase.outputs.configured }}
          SIGNING_SOURCE: ${{ steps.signing.outputs.signing_source }}
          APK_SHA1: ${{ steps.verify_apk.outputs.apk_sha1 }}
          RELEASE_TAG: ${{ steps.prepare_release_asset.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release_asset.outputs.release_title }}
          ASSET_NAME: ${{ steps.prepare_release_asset.outputs.asset_name }}
        run: |
          set -euo pipefail

          if [[ "${PUBLISH_OUTCOME}" == "success" ]]; then
            RELEASE_URL="$(gh release view "${RELEASE_TAG}" --json url --jq '.url')"
            {
              echo "## Study Tracker APK Build & Release Summary"
              echo ""
              echo "- **Status:** Build, v2/v3 signature verification, artifact upload, and GitHub Release publishing succeeded."
              echo "- **Build Variant:** \`${BUILD_TYPE}\`"
              echo "- **Signing Key:** ${SIGNING_SOURCE}"
              echo "- **Verified APK SHA-1:** \`${APK_SHA1}\`"
              echo "- **Firebase Gemini AI Logic:** Configured (${FIREBASE_CONFIGURED})"
              echo "- **Release Title:** ${RELEASE_TITLE}"
              echo "- **Release Tag:** \`${RELEASE_TAG}\`"
              echo "- **APK Asset Filename:** \`${ASSET_NAME}\`"
              echo "- **Direct Release Page:** ${RELEASE_URL}"
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            {
              echo "## Study Tracker APK Build Summary (Release Warning)"
              echo ""
              echo "- **APK Build:** Succeeded (\`${BUILD_TYPE}\`)"
              echo "- **Verified APK SHA-1:** \`${APK_SHA1}\`"
              echo "- **Firebase Gemini AI Logic:** Configured (${FIREBASE_CONFIGURED})"
              echo "- **Actions Artifact Backup:** \`study-tracker-${BUILD_TYPE}-apk\` uploaded successfully."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
